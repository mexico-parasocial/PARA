packages:
  - '.'
nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
overrides:
  '@expo/cli': '58.1.15'
  '@react-native/babel-preset': '0.88.0'
  '@react-native/normalize-colors': '0.88.0'
  '@expo/image-utils': '0.12.5'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.30.0'
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@swc/core': false
  '@unomed/react-native-matrix-sdk': true
  'core-js': false
  'core-js-pure': false
  'dtrace-provider': false
  'esbuild': false
  'protobufjs': false
  postinstall-postinstall: false
  'unrs-resolver': true
patchedDependencies:
  'react-native-safe-area-context@5.10.1': patches/react-native-safe-area-context@5.10.1.patch
  '@expo/ui@58.0.23': patches/@expo__ui@58.0.23.patch
  'expo-widgets@58.0.23': patches/expo-widgets@58.0.23.patch
  '@expo/cli@58.1.15': patches/@expo__cli@58.1.15.patch
  '@sentry/expo-upload-sourcemaps@8.18.0': patches/@sentry__expo-upload-sourcemaps@8.18.0.patch
  'expo-age-range@58.0.2': patches/expo-age-range@58.0.2.patch
  'expo-image@58.0.17': patches/expo-image@58.0.17.patch
  'expo-media-library@58.0.12': patches/expo-media-library@58.0.12.patch
  'expo-modules-core@58.0.26': patches/expo-modules-core@58.0.26.patch
  'expo-notifications@58.1.6': patches/expo-notifications@58.1.6.patch
  'expo-updates@58.0.18': patches/expo-updates@58.0.18.patch
  expo@58.0.19: patches/expo@58.0.19.patch
  'metro-runtime@0.87.1': patches/metro-runtime@0.87.1.patch
  'metro@0.87.1': patches/metro@0.87.1.patch
  'react-native-dotenv@3.4.11': patches/react-native-dotenv@3.4.11.patch
  react-native-keyboard-controller@1.22.7: patches/react-native-keyboard-controller@1.22.7.patch
  react-native-pager-view@9.0.9: patches/react-native-pager-view@9.0.9.patch
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
  'react-native-svg@15.16.0': patches/react-native-svg@15.16.0.patch
  'react-native@0.88.0': patches/react-native@0.88.0.patch
minimumReleaseAgeExclude:
  # Dormant unless a `minimumReleaseAge` policy is set; each pinned entry marks
  # a version PARA already resolves/patches as vetted (same names as upstream's
  # list, PARA's own locked versions).
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
  - react-native-nano-icons@1.0.1
  - react-native-reanimated@4.7.1
  - expo-updates@58.0.18
  - react-native-keyboard-controller@1.22.7
trustPolicyExclude:
  - 'fast-xml-parser@4.5.7'

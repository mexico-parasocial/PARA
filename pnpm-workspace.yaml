packages:
  - '.'
nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
overrides:
  '@react-native/babel-preset': '0.86.3'
  '@react-native/normalize-colors': '0.86.3'
  '@expo/image-utils': '0.8.12'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.30.0'
allowBuilds:
  '@sentry/cli': true
  '@swc/core': false
  '@unomed/react-native-matrix-sdk': true
  'core-js': false
  'core-js-pure': false
  'dtrace-provider': false
  'esbuild': false
  'protobufjs': false
  postinstall-postinstall: false
  'unrs-resolver': true
patchedDependencies:
  '@sentry/expo-upload-sourcemaps@8.18.0': patches/@sentry__expo-upload-sourcemaps@8.18.0.patch
  'expo-age-range@57.0.2': patches/expo-age-range@57.0.2.patch
  'expo-media-library@57.0.5': patches/expo-media-library@57.0.5.patch
  'expo-modules-core@57.0.20': patches/expo-modules-core@57.0.20.patch
  'expo-notifications@57.0.21': patches/expo-notifications@57.0.21.patch
  'expo-updates@57.0.24': patches/expo-updates@57.0.24.patch
  expo@57.0.26: patches/expo@57.0.26.patch
  'metro-runtime@0.84.5': patches/metro-runtime@0.84.5.patch
  'metro@0.84.5': patches/metro@0.84.5.patch
  'react-native-dotenv@3.4.11': patches/react-native-dotenv@3.4.11.patch
  'react-native-pager-view@6.8.0': patches/react-native-pager-view@6.8.0.patch
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
  'react-native-svg@15.15.4': patches/react-native-svg@15.15.4.patch
  'react-native@0.86.3': patches/react-native@0.86.3.patch
minimumReleaseAgeExclude:
  # Dormant unless a `minimumReleaseAge` policy is set; each pinned entry marks
  # a version PARA already resolves/patches as vetted (same names as upstream's
  # list, PARA's own locked versions).
  - '@atproto/*'
  - '@atproto-labs/*'
  - '@bsky.app/*'
  - '@bsky/*'
  - react-native-nano-icons@1.0.1
  - react-native-reanimated@4.7.1
  - expo-updates@57.0.24
  - react-native-keyboard-controller@1.22.7
trustPolicyExclude:
  - 'fast-xml-parser@4.5.7'
